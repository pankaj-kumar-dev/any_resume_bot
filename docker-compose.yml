services:
  postgres:
    image: postgres:17
    container_name: resume-chatbot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: resume_chatbot
      POSTGRES_USER: resume_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - resume_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_app -d resume_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  resume_pgdata:
